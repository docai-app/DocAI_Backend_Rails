# Dedicated worker: do not add grading queues or change the main worker config.
:concurrency: 1
:queues:
  - operations_reports
:timeout: 60
:scheduler:
  # The gem's default startup replaces ALL shared Redis schedules with this
  # process's (empty) YAML schedule. Enable only after our owned schedule is set.
  :enabled: false
  :listened_queues_only: true
